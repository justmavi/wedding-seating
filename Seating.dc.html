<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: #f4f4f2; color: #1f1f1d; -webkit-font-smoothing: antialiased; }
  input, button, select { font-family: inherit; }
  button { cursor: pointer; }
</style>
</helmet>

<div style="max-width: 960px; margin: 0 auto; padding: 16px 14px 48px;">

  <!-- ============ HALL VIEW ============ -->
  <sc-if value="{{ isHall }}" hint-placeholder-val="{{ true }}">
  <div>
    <div style="display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:14px;">
      <h1 style="font-size:20px; font-weight:700; margin:0;">Wedding Seating</h1>
      <span style="font-size:13px; color:#8a8a84;">{{ seatedSummary }}</span>
    </div>

    <div style="position:relative; margin-bottom:8px;">
      <input value="{{ hallSearch }}" onInput="{{ onHallSearch }}" placeholder="Search a guest across all tables…"
        style="width:100%; padding:11px 13px; font-size:15px; border:1px solid #d6d6d0; border-radius:10px; background:#fff; outline:none;">
    </div>

    <sc-if value="{{ hasHallSearch }}" hint-placeholder-val="{{ false }}">
    <div style="margin:0 0 16px; border:1px solid #e2e2dc; border-radius:10px; background:#fff; overflow:hidden;">
      <sc-if value="{{ hasResults }}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{ hallResults }}" as="r" hint-placeholder-count="2">
          <button onClick="{{ r.go }}" style="display:flex; width:100%; align-items:center; justify-content:space-between; gap:10px; padding:11px 13px; background:none; border:none; border-bottom:1px solid #f0f0ea; text-align:left; font-size:14px; color:#1f1f1d;">
            <span>{{ r.name }}</span>
            <span style="font-size:13px; font-weight:600; color:#6b6b64; white-space:nowrap;">Table #{{ r.tableNum }}</span>
          </button>
        </sc-for>
      </sc-if>
      <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
        <div style="padding:14px; font-size:14px; color:#8a8a84;">No guests found.</div>
      </sc-if>
    </div>
    </sc-if>

    <!-- Hall map -->
    <div style="margin-top:14px; padding:14px 10px; border:1px solid #e2e2dc; border-radius:14px; background:#fbfbf9;">
      <div style="display:flex; align-items:stretch; gap:8px;">

        <!-- LEFT SIDE (tables 17-32) -->
        <div style="flex:1 1 0; min-width:0; display:grid; grid-template-columns:1fr 1fr; gap:7px;">
          <sc-for list="{{ leftTables }}" as="t" hint-placeholder-count="16">
            <button onClick="{{ t.open }}" style="{{ t.style }}">
              <span style="font-weight:700; font-size:clamp(12px,3vw,15px);">#{{ t.num }}</span>
              <span style="font-size:clamp(10px,2.6vw,13px); color:{{ t.countColor }};">{{ t.count }}/13</span>
            </button>
          </sc-for>
        </div>

        <!-- CENTER -->
        <div style="flex:0 0 clamp(72px,18vw,150px); display:flex; flex-direction:column; justify-content:space-between; gap:8px; padding:2px 0;">
          <div style="display:flex; align-items:center; justify-content:center; text-align:center; padding:8px 6px; min-height:64px; border:2px solid #b58a3c; background:#fbf3e2; border-radius:8px; font-size:clamp(10px,2.4vw,13px); font-weight:600; color:#8a6414; line-height:1.25;">Bride &amp; Groom</div>
          <div style="display:flex; align-items:center; justify-content:center; text-align:center; padding:8px 6px; min-height:56px; border:2px dashed #9a9a92; background:#efefe9; border-radius:8px; font-size:clamp(10px,2.4vw,13px); font-weight:600; color:#6b6b64;">Stage</div>
        </div>

        <!-- RIGHT SIDE (tables 1-16) -->
        <div style="flex:1 1 0; min-width:0; display:grid; grid-template-columns:1fr 1fr; gap:7px;">
          <sc-for list="{{ rightTables }}" as="t" hint-placeholder-count="16">
            <button onClick="{{ t.open }}" style="{{ t.style }}">
              <span style="font-weight:700; font-size:clamp(12px,3vw,15px);">#{{ t.num }}</span>
              <span style="font-size:clamp(10px,2.6vw,13px); color:{{ t.countColor }};">{{ t.count }}/13</span>
            </button>
          </sc-for>
        </div>

      </div>
      <div style="text-align:center; margin-top:12px; font-size:11px; color:#a5a59d;">Front of hall &nbsp;·&nbsp; tap a table to edit its guests</div>
    </div>
  </div>
  </sc-if>

  <!-- ============ TABLE DETAIL VIEW ============ -->
  <sc-if value="{{ isTable }}" hint-placeholder-val="{{ false }}">
  <div>
    <button onClick="{{ back }}" style="display:inline-flex; align-items:center; gap:6px; background:none; border:none; padding:6px 0; font-size:14px; color:#6b6b64; margin-bottom:6px;">&larr; Back to hall</button>

    <div style="display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:14px;">
      <h1 style="font-size:22px; font-weight:700; margin:0;">Table #{{ curNum }}</h1>
      <span style="font-size:15px; font-weight:600; color:{{ curCountColor }};">{{ curCount }}/13 seats</span>
    </div>

    <!-- Add guest -->
    <div style="display:flex; gap:8px; margin-bottom:10px;">
      <input value="{{ addName }}" onInput="{{ onAddName }}" onKeyDown="{{ onAddKey }}" placeholder="Add guest name…"
        style="flex:1; min-width:0; padding:11px 13px; font-size:15px; border:1px solid #d6d6d0; border-radius:10px; background:#fff; outline:none;">
      <button onClick="{{ addGuest }}" style="padding:0 18px; font-size:15px; font-weight:600; color:#fff; background:#1f1f1d; border:none; border-radius:10px; white-space:nowrap;">Add</button>
    </div>

    <!-- Search within table -->
    <input value="{{ tableSearch }}" onInput="{{ onTableSearch }}" placeholder="Search in this table…"
      style="width:100%; padding:9px 13px; font-size:14px; border:1px solid #e2e2dc; border-radius:10px; background:#fff; outline:none; margin-bottom:12px;">

    <!-- Bulk action bar -->
    <sc-if value="{{ hasSelection }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 12px; margin-bottom:12px; background:#eef1f6; border:1px solid #d3dae6; border-radius:10px;">
      <span style="font-size:14px; font-weight:600; color:#33415c;">{{ selectedCount }} selected</span>
      <div style="flex:1;"></div>
      <select value="{{ bulkTarget }}" onChange="{{ onBulkTarget }}" style="padding:8px 10px; font-size:14px; border:1px solid #c5cdda; border-radius:8px; background:#fff;">
        <option value="">Move to…</option>
        <sc-for list="{{ otherTables }}" as="o" hint-placeholder-count="4">
          <option value="{{ o.num }}">Table #{{ o.num }} ({{ o.count }}/13)</option>
        </sc-for>
      </select>
      <button onClick="{{ bulkMove }}" style="padding:8px 14px; font-size:14px; font-weight:600; color:#fff; background:#33415c; border:none; border-radius:8px;">Move</button>
      <button onClick="{{ bulkRemove }}" style="padding:8px 14px; font-size:14px; font-weight:600; color:#b23b3b; background:#fff; border:1px solid #e0b6b6; border-radius:8px;">Remove</button>
    </div>
    </sc-if>

    <!-- Guest list -->
    <div style="border:1px solid #e2e2dc; border-radius:12px; background:#fff; overflow:hidden;">
      <sc-if value="{{ hasGuests }}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{ guests }}" as="g" hint-placeholder-count="3">
          <div style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid #f0f0ea;">
            <input type="checkbox" checked="{{ g.checked }}" onChange="{{ g.toggle }}" style="width:18px; height:18px; flex:0 0 auto; cursor:pointer;">
            <span style="flex:1; min-width:0; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ g.name }}</span>
            <select value="" onChange="{{ g.move }}" style="padding:6px 8px; font-size:13px; border:1px solid #d6d6d0; border-radius:8px; background:#fbfbf9; color:#6b6b64;">
              <option value="">Move…</option>
              <sc-for list="{{ otherTables }}" as="o" hint-placeholder-count="4">
                <option value="{{ o.num }}">#{{ o.num }} ({{ o.count }}/13)</option>
              </sc-for>
            </select>
            <button onClick="{{ g.remove }}" style="flex:0 0 auto; width:30px; height:30px; font-size:16px; line-height:1; color:#b23b3b; background:#fff; border:1px solid #ecd4d4; border-radius:8px;">&times;</button>
          </div>
        </sc-for>
      </sc-if>
      <sc-if value="{{ noGuests }}" hint-placeholder-val="{{ false }}">
        <div style="padding:22px 14px; text-align:center; font-size:14px; color:#a5a59d;">{{ emptyMsg }}</div>
      </sc-if>
    </div>
  </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  STORE = 'wedding-seating-v1';
  CAP = 13;

  state = { data: null, nextId: 1, view: 'hall', current: null, hallSearch: '', tableSearch: '', addName: '', selected: [], bulkTarget: '' };

  componentDidMount() {
    let data = null, nextId = 1;
    try {
      const raw = localStorage.getItem(this.STORE);
      if (raw) { const p = JSON.parse(raw); data = p.data; nextId = p.nextId || 1; }
    } catch (e) {}
    if (!data) { data = {}; for (let n = 1; n <= 32; n++) data[n] = []; }
    for (let n = 1; n <= 32; n++) if (!Array.isArray(data[n])) data[n] = [];
    this.setState({ data, nextId });
  }

  commit(data, nextId) {
    const ni = nextId == null ? this.state.nextId : nextId;
    this.setState({ data, nextId: ni });
    try { localStorage.setItem(this.STORE, JSON.stringify({ data, nextId: ni })); } catch (e) {}
  }

  countOf(n) { const d = this.state.data; return (d && d[n]) ? d[n].length : 0; }

  open = (n) => this.setState({ view: 'table', current: n, tableSearch: '', addName: '', selected: [], bulkTarget: '' });
  back = () => this.setState({ view: 'hall', current: null });

  addGuest = () => {
    const n = this.state.current, name = this.state.addName.trim();
    if (!name) return;
    if (this.countOf(n) >= this.CAP) { alert('Table #' + n + ' is full (max ' + this.CAP + ').'); return; }
    const data = { ...this.state.data };
    data[n] = [...data[n], { id: this.state.nextId, name }];
    this.commit(data, this.state.nextId + 1);
    this.setState({ addName: '' });
  };
  onAddKey = (e) => { if (e.key === 'Enter') this.addGuest(); };

  removeGuest(n, id) {
    const data = { ...this.state.data };
    data[n] = data[n].filter(g => g.id !== id);
    this.commit(data);
    this.setState(s => ({ selected: s.selected.filter(x => x !== id) }));
  }

  moveGuests(fromN, ids, toN) {
    if (!toN) return;
    toN = Number(toN);
    if (toN === fromN) return;
    const data = { ...this.state.data };
    const room = this.CAP - data[toN].length;
    if (ids.length > room) { alert('Table #' + toN + ' has only ' + room + ' free seat(s).'); return; }
    const moving = data[fromN].filter(g => ids.includes(g.id));
    data[fromN] = data[fromN].filter(g => !ids.includes(g.id));
    data[toN] = [...data[toN], ...moving];
    this.commit(data);
    this.setState(s => ({ selected: s.selected.filter(x => !ids.includes(x)) }));
  }

  toggleSel(id) {
    this.setState(s => ({ selected: s.selected.includes(id) ? s.selected.filter(x => x !== id) : [...s.selected, id] }));
  }

  tableStyle(count) {
    const full = count >= this.CAP;
    return 'display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; aspect-ratio:1/1; width:100%; border-radius:50%; border:2px solid ' +
      (full ? '#c98a4a' : (count > 0 ? '#6f8f6a' : '#c9c9c2')) + '; background:' +
      (full ? '#f6e6d4' : (count > 0 ? '#e9f0e7' : '#ffffff')) + '; color:#1f1f1d; padding:4px;';
  }
  countColor(count) { return count >= this.CAP ? '#b26a26' : (count > 0 ? '#4f7049' : '#a5a59d'); }

  buildTables(nums) {
    // nums: array of 16 numbers ordered top-row-left, top-row-right, ... (i.e. display order)
    return nums.map(num => {
      const count = this.countOf(num);
      return { num, count, style: this.tableStyle(count), countColor: this.countColor(count), open: () => this.open(num) };
    });
  }

  renderVals() {
    const s = this.state;
    if (!s.data) return { isHall: true, isTable: false, leftTables: [], rightTables: [], hallSearch: '', hasHallSearch: false, seatedSummary: '' };

    // Display order: top row shows highest pair, bottom row shows lowest pair.
    const rightNums = [], leftNums = [];
    for (let t = 0; t < 8; t++) {
      const r = 7 - t;
      rightNums.push(2 * r + 1, 2 * r + 2);      // 1..16
      leftNums.push(17 + 2 * r, 18 + 2 * r);     // 17..32
    }

    let total = 0; for (let n = 1; n <= 32; n++) total += this.countOf(n);

    const base = {
      isHall: s.view === 'hall',
      isTable: s.view === 'table',
      leftTables: this.buildTables(leftNums),
      rightTables: this.buildTables(rightNums),
      seatedSummary: total + ' guests seated',
      hallSearch: s.hallSearch,
      onHallSearch: (e) => this.setState({ hallSearch: e.target.value }),
    };

    // Hall search
    const q = s.hallSearch.trim().toLowerCase();
    base.hasHallSearch = q.length > 0;
    let results = [];
    if (q) {
      for (let n = 1; n <= 32; n++) {
        for (const g of s.data[n]) if (g.name.toLowerCase().includes(q)) results.push({ name: g.name, tableNum: n, go: () => this.open(n) });
      }
    }
    base.hallResults = results;
    base.hasResults = results.length > 0;
    base.noResults = q.length > 0 && results.length === 0;

    // Table detail
    if (s.view === 'table') {
      const n = s.current;
      const cnt = this.countOf(n);
      base.curNum = n;
      base.curCount = cnt;
      base.curCountColor = this.countColor(cnt);
      base.addName = s.addName;
      base.tableSearch = s.tableSearch;
      base.bulkTarget = s.bulkTarget;
      base.onAddName = (e) => this.setState({ addName: e.target.value });
      base.onAddKey = this.onAddKey;
      base.addGuest = this.addGuest;
      base.onTableSearch = (e) => this.setState({ tableSearch: e.target.value });
      base.back = this.back;

      const otherTables = [];
      for (let m = 1; m <= 32; m++) if (m !== n) otherTables.push({ num: m, count: this.countOf(m) });
      base.otherTables = otherTables;

      const tq = s.tableSearch.trim().toLowerCase();
      const list = s.data[n].filter(g => !tq || g.name.toLowerCase().includes(tq));
      base.guests = list.map(g => ({
        id: g.id, name: g.name,
        checked: s.selected.includes(g.id),
        toggle: () => this.toggleSel(g.id),
        remove: () => this.removeGuest(n, g.id),
        move: (e) => { const v = e.target.value; e.target.value = ''; this.moveGuests(n, [g.id], v); },
      }));
      base.hasGuests = list.length > 0;
      base.noGuests = list.length === 0;
      base.emptyMsg = tq ? 'No matches in this table.' : 'No guests yet — add someone above.';

      base.selectedCount = s.selected.length;
      base.hasSelection = s.selected.length > 0;
      base.onBulkTarget = (e) => this.setState({ bulkTarget: e.target.value });
      base.bulkMove = () => { if (!s.bulkTarget) { alert('Choose a table to move to.'); return; } this.moveGuests(n, [...s.selected], s.bulkTarget); this.setState({ bulkTarget: '' }); };
      base.bulkRemove = () => { if (confirm('Remove ' + s.selected.length + ' selected guest(s)?')) { const data = { ...s.data }; data[n] = data[n].filter(g => !s.selected.includes(g.id)); this.commit(data); this.setState({ selected: [] }); } };
    }

    return base;
  }
}
</script>
</body>
</html>
